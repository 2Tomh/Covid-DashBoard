<div class="modal-overlay" (click)="onOverlayClick($event)">
  <div class="modal-panel" dir="rtl">

    <div class="modal-header">
      <h2>ניהול גרפים ונתונים</h2>
      <button class="btn-close" (click)="goBack()">✕</button>
    </div>

    <div class="modal-body">
      <div class="custom-form-group">
        <label class="custom-label">בחר קטגוריית נתונים לעריכה</label>
        <div class="select-wrapper">
          <select [(ngModel)]="selectedChart" (ngModelChange)="onChartChange()" class="custom-input">
            <option *ngFor="let chart of charts" [ngValue]="chart" [disabled]="chart.isHeader">
              {{ chart.label }}
            </option>
          </select>
        </div>
      </div>

      <div class="loader-container" *ngIf="loading">
        <div class="simple-spinner"></div>
        <span>טוען הגדרות...</span>
      </div>

      <div class="settings-content" *ngIf="!loading">
        <div class="section">
          <h3 class="section-title">נראות סדרות נתונים בגרף</h3>
          <div class="series-grid">
            <div *ngFor="let s of selectedChart.series" class="series-card"
              [class.active]="isSeriesVisible(s.key)" (click)="toggleSeries(s.key)">
              <div class="checkbox-box">
                <span *ngIf="isSeriesVisible(s.key)">✓</span>
              </div>
              <span class="series-label">{{ s.label }}</span>
            </div>
          </div>
        </div>

        <div class="section" *ngIf="selectedChart.uploadType">
          <h3 class="section-title">עדכון נתונים (קובץ Excel)</h3>
          <div class="upload-container">
            <div class="upload-log" *ngIf="uploadLog">
              <div class="file-info">
                <div class="file-details">
                  <span class="file-name">{{ uploadLog.fileName }}</span>
                  <span class="upload-date">הועלה ב: {{ uploadLog.uploadedAt | date:'dd/MM/yyyy HH:mm' }}</span>
                </div>
              </div>
              <button class="btn-delete-log" (click)="deleteUploadLog()">מחק</button>
            </div>
            <div class="file-input-wrapper">
              <input type="file" id="fileUpload" accept=".xlsx, .csv"
                (change)="onFileSelected($event)" class="hidden-input" />
              <label for="fileUpload" class="file-label">בחר קובץ להעלאה</label>
            </div>
            <span class="status-msg" *ngIf="statusMessage"
              [class.error]="statusMessage" [class.success]="statusMessage">
              {{ statusMessage }}
            </span>
          </div>
        </div>

        <div class="actions-footer">
          <button class="btn-save-main" (click)="save()">שמור הגדרות תצוגה</button>
          <div class="saved-indicator" *ngIf="saved">
            <span>✓</span> ההגדרות נשמרו בהצלחה
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
