<div class="modal-backdrop" (click)="onClose.emit()">
  <div class="modal" (click)="$event.stopPropagation()">

    <div class="modal-header">
      <h3>עריכת פרופיל</h3>
      <button class="modal-close" (click)="onClose.emit()">✕</button>
    </div>

    <div class="modal-body">

      <div class="form-group">
        <label>שם מלא *</label>
        <input type="text" [(ngModel)]="profileForm.fullName" placeholder="ישראל ישראלי" />
      </div>

      <div class="form-group">
        <label>אימייל *</label>
        <input type="email" [(ngModel)]="profileForm.email" placeholder="admin@health.gov.il" />
      </div>

      <hr class="divider" />

      <p class="section-hint">שינוי סיסמה — השאר ריק אם אינך רוצה לשנות</p>

      <div class="form-group">
        <label>סיסמה נוכחית</label>
        <input type="password" [(ngModel)]="passwordForm.currentPassword" placeholder="••••••••" />
      </div>

      <div class="form-group">
        <label>סיסמה חדשה</label>
        <input type="password" [(ngModel)]="passwordForm.newPassword" placeholder="••••••••" />
      </div>

      <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>

    </div>

    <div class="modal-footer">
      <button class="btn-secondary" (click)="onClose.emit()">ביטול</button>
      <button class="btn-primary" (click)="save()">שמור שינויים</button>
    </div>

  </div>
</div>
